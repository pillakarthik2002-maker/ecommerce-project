{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<div class="register-container">

    <div class="register-card">

        <div class="register-body">

            <h2>
                Create Account
            </h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="register-btn">
                    Register
                </button>

            </form>

            <p class="login-text">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>

{% endblock %}
