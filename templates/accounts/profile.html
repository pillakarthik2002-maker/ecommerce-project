{% extends 'base.html' %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4">
                    My Profile
                </h2>

                <p>
                    <strong>Username:</strong>
                    {{ user.username }}
                </p>

                <p>
                    <strong>Email:</strong>
                    {{ user.email }}
                </p>

                <a
                    href="{% url 'home' %}"
                    class="btn btn-secondary"
                >
                    Home
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
